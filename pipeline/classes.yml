# Classes of Throne of Lies.
#
# Each class:
#   name:        newest name; class pages use it
#   faction:     Blue Dragon | Unseen | Cult | Neutral | Varies
#   verified:    false where the faction or convert link is an unconfirmed guess
#   convertOf:   for convert classes, the Blue Dragon class they come from
#   formerNames: earlier names, with the patch that renamed them
#   aliases:     abbreviations players and devs use (matched case-sensitively)
#   abilities:   ability names that identify the class on their own
#   added / retired: only where a patch note says so (first/last mention is
#                computed by the build)
#   history:     earlier faction or convert link, until the patch that changed it
#   notes:       sources and open questions
#
# Sources: the patch notes (cited by version), the 2016 class reveals, and the
# user's decisions on card TO-2.

classes:

